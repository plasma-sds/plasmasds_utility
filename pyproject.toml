[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "plasmasds_utility"
dynamic = ["version"]
description = "Move data between the plasma-sds data server and a local working directory."
readme = "README.md"
license = "LGPL-2.1-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["paramiko>=4"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/plasma-sds/plasmasds_utility"
Issues = "https://github.com/plasma-sds/plasmasds_utility/issues"

[tool.hatch.version]
path = "src/plasmasds_utility/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not private"]
markers = [
    "private: needs SSH access to the private data server; run with -m private",
    "network: downloads from the public data server; runs by default",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.11"

[tool.pixi.pypi-dependencies]
plasmasds_utility = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = ">=8"

[tool.pixi.feature.test.tasks]
test = "pytest"

[tool.pixi.feature.lint.dependencies]
ruff = ">=0.15"

[tool.pixi.feature.lint.tasks]
lint = "ruff check . && ruff format --check ."

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
default = ["test", "lint"]
py311 = ["py311", "test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
